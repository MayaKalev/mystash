services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mystash
      POSTGRES_PASSWORD: mystash
      POSTGRES_DB: mystash
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mystash"]
      interval: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://mystash:mystash@db:5432/mystash
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-at-least-32-characters-long
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./api
    command: rq worker --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://mystash:mystash@db:5432/mystash
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-at-least-32-characters-long
      # Read from your shell or a root .env file, so the key is never in this file.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - api
      - redis

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_POLLING: "true"
    volumes:
      # Code changes show up in the browser right away, without rebuilding.
      - ./web/src:/app/src
    depends_on:
      - api

volumes:
  pgdata:
